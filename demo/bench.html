<!doctype html>
<html lang="th">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>@elitjs/log — browser benchmark</title>
    <style>
      body {
        font: 14px/1.6 ui-monospace, Consolas, monospace;
        max-width: 860px;
        margin: 32px auto;
        padding: 0 16px;
        color: #d4d4d4;
        background: #1e1e1e;
      }
      h1 { font-size: 18px; }
      table { border-collapse: collapse; width: 100%; margin: 16px 0; }
      th,
      td { border: 1px solid #3a3a3a; padding: 6px 10px; text-align: left; }
      th { background: #252526; color: #9cdcfe; }
      td.num { text-align: right; }
      button {
        font: inherit;
        padding: 6px 16px;
        background: #333;
        color: #eee;
        border: 1px solid #555;
        border-radius: 6px;
        cursor: pointer;
      }
      button:hover { background: #444; }
      .note { color: #9e9e9e; font-size: 12px; }
    </style>
  </head>
  <body>
    <h1>@elitjs/log — browser benchmark (รันใน engine จริง)</h1>
    <p class="note" id="meta"></p>
    <button id="rerun">↻ รันใหม่</button>
    <p id="status">กำลังรัน...</p>
    <table id="out">
      <thead>
        <tr><th>case</th><th class="num">ns/op</th><th class="num">ops/s</th></tr>
      </thead>
      <tbody></tbody>
    </table>
    <p class="note">
      ผลลัพธ์ถูกเก็บไว้ที่ <code>window.__benchResults</code> ด้วย (ใช้ automation อ่านได้) —
      หมายเหตุ: performance.now() ใน browser มีความละเอียดจำกัด (~µs) ค่าจึงเป็นค่าประมาณ
      ของค่าเฉลี่ยต่อ operation จากลูปใหญ่ (best of 3 rounds)
    </p>

    <script type="module">
      import { createLogger, installBrowser } from '../dist/browser.js';

      const ROUNDS = 3;
      const results = [];
      const user = { id: 7, name: 'alice', roles: ['admin', 'user'] };
      const log = createLogger('bench');

      function bench(name, fn, N) {
        const per = Math.max(20_000, Math.floor(N / ROUNDS));
        for (let i = 0; i < Math.min(5_000, per >> 4); i++) fn(i); // warmup
        let best = Infinity;
        for (let r = 0; r < ROUNDS; r++) {
          const t0 = performance.now();
          for (let i = 0; i < per; i++) fn(i);
          const ns = ((performance.now() - t0) * 1e6) / per;
          if (ns < best) best = ns;
        }
        results.push({ name, ns: best, ops: Math.round(1e9 / best) });
      }

      function render() {
        const tb = document.querySelector('#out tbody');
        tb.innerHTML = '';
        for (const r of results) {
          const tr = document.createElement('tr');
          const a = document.createElement('td');
          a.textContent = r.name;
          const b = document.createElement('td');
          b.className = 'num';
          b.textContent = r.ns.toFixed(1);
          const c = document.createElement('td');
          c.className = 'num';
          c.textContent = r.ops.toLocaleString('en-US');
          tr.append(a, b, c);
          tb.appendChild(tr);
        }
      }

      function run() {
        results.length = 0;
        document.getElementById('status').textContent = 'กำลังรัน...';

        bench('console.log("hello")', () => console.log('hello'), 150_000);
        bench('console.log + ต่อ string + JSON.stringify', () => console.log('user ' + user.name + ' ' + JSON.stringify(user)), 100_000);

        installBrowser({ enabled: false });
        bench('@elitjs/log ปิดสนิท (enabled=false → noop)', () => log.debug('user %s %j', user.name, user), 1_500_000);
        bench('@elitjs/log ปิดสนิท + lazy thunk', () => log.debug(() => ['user %s %j', user.name, user]), 1_500_000);

        // default ของ dev จริง: buffer เก็บครบทุก level + console echo=warn (debug ไม่ echo)
        installBrowser({ enabled: true, console: 'warn', buffer: true });
        bench('@elitjs/log browser default (buffer เก็บครบ)', () => log.debug('user %s %j', user.name, user), 600_000);
        bench('@elitjs/log browser default + lazy thunk', () => log.debug(() => ['user %s %j', user.name, user]), 600_000);

        installBrowser({ enabled: true, console: 'debug', buffer: true });
        bench('@elitjs/log เปิด echo ลง console (log.info)', () => log.info('hello'), 100_000);

        installBrowser({ src: true });
        bench('@elitjs/log + source capture (?src=1 — จับ stack)', () => log.debug('user %s %j', user.name, user), 30_000);
        installBrowser({ enabled: true, console: 'warn', buffer: true, src: false });

        render();
        window.__benchResults = results;
        document.getElementById('status').textContent = 'เสร็จแล้ว ✓';
      }

      document.getElementById('meta').textContent = navigator.userAgent;
      document.getElementById('rerun').addEventListener('click', run);
      run(); // รันอัตโนมัติตอนโหลด
    </script>
  </body>
</html>
